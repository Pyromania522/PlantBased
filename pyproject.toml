[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --cov=custom_components.plantbased --cov-report=term-missing --cov-report=xml --cov-branch --cov-fail-under=90"

[tool.coverage.run]
source = ["custom_components.plantbased"]
branch = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.plantbased"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components/plantbased"]
follow_imports = "silent"
