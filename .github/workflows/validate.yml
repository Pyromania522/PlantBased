name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          comment: false

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            requirements: requirements-test-min.txt
            ha: "2025.10.0"
          - python: "3.14"
            requirements: requirements-dev.txt
            ha: "2026.10.2"
    name: Tests (HA ${{ matrix.ha }})
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r ${{ matrix.requirements }}
      - run: pytest --junitxml=pytest-results.xml
      - name: Annotate pytest fixture failures
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("pytest-results.xml")
          if report.is_file():
              for case in ElementTree.parse(report).iter("testcase"):
                  for error in case.findall("error"):
                      detail = (error.text or error.get("message", ""))[-6000:]
                      message = f"{case.get('classname')}.{case.get('name')}\n{detail}"
                      message = message.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error::{message}")
          PY
      - name: Verify real filesystem storage
        run: python -m script.check_storage

  frontend:
    name: Frontend build and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - name: Verify original SVG sources
        run: |
          python3 script/build_illustrations.py
          git diff --exit-code -- frontend/public/illustrations
      - run: npm run check:bundle
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: plantbased-browser-evidence
          path: |
            /tmp/plantbased-*.png
            test-results/
          if-no-files-found: ignore
